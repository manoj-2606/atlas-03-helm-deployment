# =============================================================================
# Stage 3: Build
# =============================================================================
  - stage: Build
    displayName: '3 - Build + Scan + Push'
    dependsOn: Infra
    jobs:
      - job: DockerBuildPush
        displayName: 'Docker Build → Trivy → ACR'
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            persistCredentials: true
          - checkout: app

          - task: AzureCLI@2
            displayName: 'Run build.ps1'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptPath: $(scriptsDir)/build.ps1
              arguments: >-
                -TerraformDir "$(tfDir)"
                -BackendRG "$(backendResourceGroup)"
                -BackendSA "$(backendStorageAccount)"
                -BackendContainer "$(backendContainer)"
                -BackendKey "$(backendKey)"
                -DockerfilePath "$(projectDir)/Dockerfile"
                -BuildContext "$(appDir)"
                -ImageTag "$(imageTag)"
              addSpnToEnvironment: true

          - task: PowerShell@2
            displayName: 'Log Error (if failed)'
            condition: failed()
            inputs:
              targetType: filePath
              filePath: $(scriptsDir)/log-error.ps1
              arguments: >-
                -Stage "Build"
                -BuildNumber "$(Build.BuildNumber)"
                -RepoDir "$(projectDir)"

# =============================================================================
# Stage 4: Deploy
# =============================================================================
  - stage: Deploy
    displayName: '4 - Deploy to AKS'
    dependsOn: Build
    jobs:
      - deployment: HelmDeploy
        displayName: 'Helm Deploy + Smoke Test'
        environment: atlas-03-deploy
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  persistCredentials: true
                - checkout: app

                - task: AzureCLI@2
                  displayName: 'Run deploy.ps1'
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: pscore
                    scriptPath: $(scriptsDir)/deploy.ps1
                    arguments: >-
                      -TerraformDir "$(tfDir)"
                      -BackendRG "$(backendResourceGroup)"
                      -BackendSA "$(backendStorageAccount)"
                      -BackendContainer "$(backendContainer)"
                      -BackendKey "$(backendKey)"
                      -ChartPath "$(chartPath)"
                      -ValuesFile "$(valuesFile)"
                      -ReleaseName "$(releaseName)"
                      -Namespace "$(namespace)"
                      -ImageTag "$(imageTag)"
                    addSpnToEnvironment: true

                - task: PowerShell@2
                  displayName: 'Log Error (if failed)'
                  condition: failed()
                  inputs:
                    targetType: filePath
                    filePath: $(scriptsDir)/log-error.ps1
                    arguments: >-
                      -Stage "Deploy"
                      -BuildNumber "$(Build.BuildNumber)"
                      -RepoDir "$(projectDir)"