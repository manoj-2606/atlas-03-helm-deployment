# Pattern: YAML orchestrator + PowerShell engines + automated error logging
# =============================================================================

trigger: none

resources:
  repositories:
    - repository: app
      type: git
      name: Atlas-Platform/atlas-platform-app
      ref: refs/heads/main

variables:
  - group: atlas-03-vars
  - name: projectDir
    value: $(Build.SourcesDirectory)/atlas-03-helm-deployment
  - name: appDir
    value: $(Build.SourcesDirectory)/atlas-platform-app
  - name: tfDir
    value: $(Build.SourcesDirectory)/atlas-03-helm-deployment/terraform
  - name: scriptsDir
    value: $(Build.SourcesDirectory)/atlas-03-helm-deployment/scripts
  - name: chartPath
    value: $(Build.SourcesDirectory)/atlas-03-helm-deployment/charts/atlas-platform
  - name: valuesFile
    value: $(Build.SourcesDirectory)/atlas-03-helm-deployment/charts/atlas-platform/values-dev.yaml
  - name: releaseName
    value: atlas-platform-app
  - name: namespace
    value: atlas
  - name: imageTag
    value: $(Build.BuildNumber)

