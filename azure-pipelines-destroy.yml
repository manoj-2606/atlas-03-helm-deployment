# =============================================================================
# atlas-03-helm-deployment — Destroy Pipeline
# =============================================================================

trigger: none

variables:
  - group: atlas-03-vars
  - name: projectRG
    value: rg-atlas-03-dev

stages:
  - stage: Destroy
    displayName: 'Destroy All Resources'
    jobs:
      - deployment: TearDown
        displayName: 'Terraform Destroy + Cleanup'
        environment: atlas-03-destroy
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  persistCredentials: true

                - task: AzureCLI@2
                  displayName: 'Run destroy.ps1'
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: pscore
                    scriptPath: $(Build.SourcesDirectory)/scripts/destroy.ps1
                    arguments: >-
                      -TerraformDir "$(Build.SourcesDirectory)/terraform"
                      -VarFile "$(Build.SourcesDirectory)/terraform/dev.tfvars"
                      -BackendRG "$(backendResourceGroup)"
                      -BackendSA "$(backendStorageAccount)"
                      -BackendContainer "$(backendContainer)"
                      -BackendKey "$(backendKey)"
                      -ProjectRG "$(projectRG)"
                    addSpnToEnvironment: true

                - task: PowerShell@2
                  displayName: 'Log Error (if failed)'
                  condition: failed()
                  inputs:
                    targetType: filePath
                    filePath: $(Build.SourcesDirectory)/scripts/log-error.ps1
                    arguments: >-
                      -Stage "Destroy"
                      -BuildNumber "$(Build.BuildNumber)"
                      -RepoDir "$(Build.SourcesDirectory)"